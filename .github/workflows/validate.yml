name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without dependencies
        run: python -m pip install --no-deps .
      - name: Check POSIX console entry points
        if: runner.os != 'Windows'
        run: |
          kitcli --help
          agent-kits --json catalog list
      - name: Check Windows console entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import importlib.metadata as m; names = {entry.name for entry in m.distribution('agent-kits').entry_points}; assert {'kitcli', 'agent-kits'} <= names"
          python -m agent_kits --help
          python -m agent_kits --json catalog list
      - name: Compile package and tests
        run: python -m compileall -q src tests
      - name: Run isolated tests
        run: python -m unittest discover -s tests -v
      - name: Check package dependencies
        run: python -m pip check
