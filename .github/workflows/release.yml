name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir build
          python -m build
          sha256sum dist/* scripts/install.sh scripts/install.ps1 > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          gh --version
          tag="$RELEASE_TAG"
          if [ "$tag" = "master" ] || [ "$tag" = "main" ]; then tag="$DISPATCH_TAG"; fi
          test -n "$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" dist/* SHA256SUMS scripts/install.sh scripts/install.ps1 --generate-notes
