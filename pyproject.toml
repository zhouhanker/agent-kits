[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kits"
version = "0.1.5"
description = "Cross-platform planning and installation tools for agent configuration kits."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
kitcli = "agent_kits.cli.main:main"
agent-kits = "agent_kits.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
